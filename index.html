<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyPoint — NIS Grade 8</title><style>
:root{--bg:#f2f7fb;--card:#fff;--text:#17283e;--muted:#61748b;--line:#dbe6ef;--p:#12677f;--p2:#11a18e;--soft:#e0f3f2;--good:#14845e;--bad:#c53f53}[data-theme=dark]{--bg:#101923;--card:#182635;--text:#edf6fb;--muted:#a6b9cb;--line:#2b4052;--p:#70c9df;--p2:#5ed6bf;--soft:#203d47;--good:#6bd9a7;--bad:#ff8da0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,Arial,sans-serif}.app{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:22px}.brand{font-size:22px;font-weight:850}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-weight:750;cursor:pointer}.primary{background:linear-gradient(120deg,var(--p),var(--p2));color:white;border:0}.hero{padding:32px;border-radius:25px;color:white;background:linear-gradient(125deg,#103b59,#176b87,#12a18e);display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.1}.stats,.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:16px;border:1px solid #ffffff35;background:#ffffff16;border-radius:15px}.stat b{display:block;font-size:27px}.head{margin:28px 0 14px}.grid3{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:20px}.subject{cursor:pointer}.icon{font-size:28px}.muted,.small{color:var(--muted)}.title{display:flex;align-items:center;gap:12px;margin:10px 0 20px}.title h1{margin:0}.topicgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.theorylayout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,.6fr);gap:15px}.theory h2{margin:22px 0 7px}.theory p{line-height:1.9;white-space:pre-line}.diagram{background:var(--soft);border-radius:16px;padding:15px;margin:15px 0}.diagram svg{width:100%;height:auto}.note{padding:14px;background:var(--soft);border-left:4px solid var(--p2);border-radius:0 12px 12px 0}.example{padding:15px;background:var(--bg);border:1px solid var(--line);border-radius:13px;white-space:pre-line}.pill{display:inline-block;padding:4px 9px;background:var(--soft);color:var(--p);border-radius:99px;font-size:11px;font-weight:850}.qbox{max-width:800px;margin:auto}.qmeta,.row,.qbottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.qmeta{color:var(--muted)}.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,var(--p),var(--p2))}.answers{display:grid;gap:10px}.answer{padding:14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);cursor:pointer}.answer.selected{border-color:var(--p);background:var(--soft)}.answer.good{border-color:var(--good)}.answer.bad{border-color:var(--bad)}.explain{margin-top:15px;padding:14px;border-radius:12px;background:var(--bg)}.row{padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.score{text-align:center;font-size:58px;font-weight:900;color:var(--p)}.reviewitem,.historyitem{border-top:1px solid var(--line);padding:14px 0}.footer{text-align:center;color:var(--muted);padding:25px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 16px;background:var(--text);color:var(--bg);border-radius:12px}@media(max-width:780px){.app{padding:12px}.hero,.grid3,.topicgrid,.theorylayout{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><div class="app"><header class="top"><a class="brand" href="#" onclick="home();return false">✦ StudyPoint</a><div><button class="btn" onclick="theme()">☾ Тема</button> <button class="btn" onclick="progress()">Мой прогресс</button></div></header><main id="view"></main><footer class="footer">StudyPoint · Учись. Проверяй. Улучшай. · <a href="#" onclick="about();return false">О проекте</a></footer></div><div id="toast" class="toast"></div><script>
const topics=[{"id": "roots", "sub": "Математика", "name": "Квадратные корни и иррациональные выражения", "theory": "Квадратный корень √a — неотрицательное число, квадрат которого равен a; в действительных числах a≥0. Поэтому √49=7, но уравнение x²=49 имеет два решения ±7. Важно помнить √(x²)=|x|. Свойства √(ab)=√a·√b и √(a/b)=√a/√b применяются при подходящих условиях: a,b≥0, а для знаменателя b>0. Упрощай корни выделением полного квадрата: √72=√(36·2)=6√2. Складывать можно лишь подобные радикалы после упрощения: 2√12+√27=4√3+3√3=7√3. Для 1/√(x−2) требуется x>2: подкоренное выражение должно быть неотрицательным, а знаменатель не может быть нулём. Сравнивать неотрицательные корни можно сравнением подкоренных чисел. Рационализация знаменателя выполняется умножением числителя и знаменателя на подходящий множитель.", "example": "√48−√12+√75=4√3−2√3+5√3=7√3. Для √(x−5)² результат равен |x−5|; если x<5, это 5−x.", "q": [["Упростите √98", "7√2", ["14√2", "49√2", "7√7"], "98=49·2, поэтому √98=7√2.", "Средний"], ["При каких x определено √(3x−6)?", "x≥2", ["x>2", "x≤2", "x≠2"], "Требуется 3x−6≥0, значит x≥2.", "Средний"], ["Чему равно √(−9) в действительных числах?", "Не определено", ["−3", "3", "−9"], "В действительных числах подкоренное выражение должно быть неотрицательным.", "Базовый"], ["Упростите 3√8−√18", "3√2", ["5√2", "√2", "3√10"], "√8=2√2 и √18=3√2; 6√2−3√2=3√2.", "Средний"], ["Чему равно √(5²)?", "5", ["±5", "25", "−5"], "Знак корня обозначает неотрицательное значение.", "Средний"], ["Решите x²=36", "x=−6 или x=6", ["Только x=6", "Только x=−6", "x=18"], "Оба числа при возведении в квадрат дают 36.", "Базовый"], ["Упростите √12·√3", "6", ["6√3", "√15", "36"], "√12·√3=√36=6.", "Средний"], ["Область определения 1/√(x−2)", "x>2", ["x≥2", "x<2", "x≠2"], "Подкоренное выражение положительно, так как знаменатель не может быть нулём.", "Сложный"], ["Упростите 2√27+√12", "8√3", ["7√3", "5√3", "8√6"], "2√27=6√3 и √12=2√3; сумма 8√3.", "Средний"], ["Сравните √11 и 3", "√11>3", ["√11<3", "√11=3", "Нельзя сравнить"], "11>9, следовательно √11>√9=3.", "Сложный"]]}, {"id": "polygons", "sub": "Математика", "name": "Многоугольники. Исследование четырёхугольников", "theory": "Сумма внутренних углов выпуклого n-угольника равна (n−2)·180°: из одной вершины фигуру можно разбить на n−2 треугольника. Сумма внешних углов выпуклого многоугольника, взятых по одному при каждой вершине, равна 360°. У параллелограмма противоположные стороны параллельны и равны, противоположные углы равны, соседние углы дают 180°, диагонали делятся пополам. Прямоугольник — параллелограмм с прямыми углами; его диагонали равны. Ромб имеет четыре равные стороны, а его диагонали перпендикулярны и делят углы пополам. Квадрат одновременно является прямоугольником и ромбом. Одного равенства диагоналей недостаточно, чтобы доказать, что любой четырёхугольник — прямоугольник. Средняя линия трапеции равна полусумме оснований: m=(a+b)/2. В доказательствах опирайся на определения, признаки и свойства, а не на вид рисунка.", "example": "У правильного десятиугольника сумма углов (10−2)·180°=1440°, каждый угол равен 144°. У трапеции с основаниями 8 и 14 см средняя линия равна 11 см.", "q": [["Сумма углов семиугольника", "900°", ["720°", "1080°", "1260°"], "(7−2)·180°=900°.", "Базовый"], ["Каждый угол правильного шестиугольника", "120°", ["60°", "90°", "135°"], "Сумма 720°, делим на 6.", "Средний"], ["У параллелограмма угол 68°. Соседний угол", "112°", ["68°", "122°", "292°"], "Соседние углы в сумме дают 180°.", "Базовый"], ["AO=7 см — половина диагонали параллелограмма. OC равен", "7 см", ["14 см", "3,5 см", "Зависит от углов"], "Диагонали параллелограмма делятся точкой пересечения пополам.", "Средний"], ["Признак параллелограмма", "Диагонали делятся точкой пересечения пополам", ["Диагонали равны", "Один угол прямой", "Одна пара сторон равна"], "Это один из признаков параллелограмма.", "Сложный"], ["Средняя линия трапеции с основаниями 8 и 14 см", "11 см", ["22 см", "6 см", "7 см"], "(8+14)/2=11 см.", "Средний"], ["Сумма внешних углов выпуклого многоугольника", "360°", ["180°", "540°", "Зависит от числа сторон"], "Полный обход даёт суммарный поворот 360°.", "Сложный"], ["Диагонали ромба", "Перпендикулярны и делят углы пополам", ["Всегда равны", "Параллельны", "Не пересекаются"], "Это свойства диагоналей ромба.", "Средний"], ["Что верно о диагоналях прямоугольника?", "Равны и делятся пополам", ["Все стороны равны", "Перпендикулярны всегда", "Не пересекаются"], "Прямоугольник — параллелограмм с равными диагоналями.", "Средний"], ["Равные диагонали доказывают, что произвольный четырёхугольник прямоугольник?", "Нет, условия недостаточно", ["Да, всегда", "Только если стороны равны", "Да, всегда при одном прямом угле"], "Например, у равнобедренной трапеции тоже равные диагонали.", "Сложный"]]}, {"id": "metals", "sub": "Химия", "name": "Свойства металлов", "theory": "В модели металлической связи положительные ионы образуют решётку, а делокализованные электроны могут перемещаться. Это объясняет электропроводность и помогает объяснить теплопроводность. Смещение слоёв частиц связано с ковкостью и пластичностью. Свойства и активность металлов различаются. Во многих реакциях атом металла отдаёт электроны и образует катион: Na→Na⁺+e⁻. Многие металлы реагируют с кислородом, образуя оксиды: 2Mg+O₂→2MgO; 4Al+3O₂→2Al₂O₃. При уравнивании реакций меняют коэффициенты, но не индексы формул: индекс меняет состав вещества. Сплавы содержат несколько элементов, хотя бы один из которых металл; свойства зависят от состава и структуры. Отделяй наблюдение от вывода и не обобщай результат одного опыта на все металлы.", "example": "Al+O₂→Al₂O₃: 4Al+3O₂→2Al₂O₃. Слева и справа 4 атома Al и 6 атомов O.", "q": [["Что объясняет электропроводность металлов?", "Подвижные делокализованные электроны", ["Неподвижные нейтроны", "Молекулы воды", "Отсутствие частиц"], "Электроны могут перемещаться по металлической решётке.", "Средний"], ["M→M²⁺+…: что отдаёт атом?", "2 электрона", ["2 протона", "1 нейтрон", "2 атома кислорода"], "Заряд +2 соответствует потере двух электронов.", "Средний"], ["Уравняйте Mg+O₂→MgO", "2Mg+O₂→2MgO", ["Mg+O₂→MgO₂", "Mg+2O₂→MgO", "Mg+O₂→2MgO"], "Сначала уравниваем кислород, затем магний.", "Средний"], ["Способность металла деформироваться без разрушения", "Пластичность", ["Растворимость", "Летучесть", "Кислотность"], "Пластичность позволяет менять форму без разрушения.", "Базовый"], ["Сколько атомов O в 3Al₂O₃?", "9", ["3", "6", "12"], "В одной формульной единице 3 O; 3×3=9.", "Средний"], ["Продукт реакции Al с кислородом", "Оксид алюминия", ["Гидроксид алюминия", "Хлорид алюминия", "Водород"], "Al₂O₃ — соединение алюминия с кислородом.", "Базовый"], ["Что означает коэффициент 2 перед Mg?", "Две частицы Mg", ["В атоме два Mg", "Заряд Mg равен +2", "Два атома кислорода"], "Коэффициент задаёт количество частиц в уравнении.", "Средний"], ["Какое обобщение корректно?", "Активность зависит от металла и условий", ["Все металлы реагируют одинаково", "Все металлы мягкие", "Металлы никогда не окисляются"], "Реакционная способность металлов различается.", "Сложный"], ["Что нельзя менять при балансировке?", "Индексы в формулах", ["Коэффициенты", "Количество молекул", "Коэффициент перед веществом"], "Изменение индекса означает другое вещество.", "Сложный"], ["Атом потерял три электрона. Его заряд", "+3", ["−3", "0", "+1"], "Потеря отрицательных зарядов даёт положительный заряд.", "Средний"]]}, {"id": "water", "sub": "Химия", "name": "Вода", "theory": "Формула воды H₂O: молекула содержит два атома водорода и один атом кислорода. Связи O–H полярны, а изогнутая форма молекулы делает распределение зарядов несимметричным, поэтому вода полярна. Между молекулами образуются водородные связи, влияющие на температуру кипения и поверхностное натяжение. Вода растворяет многие ионные и полярные вещества, но не все вещества растворимы одинаково хорошо. Раствор состоит из растворителя и растворённого вещества; растворимость зависит от вещества и условий. Активные металлы могут реагировать с водой с образованием гидроксида и водорода: 2Na+2H₂O→2NaOH+H₂↑. Такие реакции могут быть бурными и не должны проводиться самостоятельно. Прозрачность воды не доказывает питьевую безопасность: микроорганизмы и растворённые загрязнители могут быть невидимы.", "example": "В 3H₂O находятся 6 атомов H и 3 атома O. Коэффициент 3 означает три молекулы, индекс 2 — два атома H в каждой.", "q": [["Сколько всего атомов в H₂O?", "3", ["2", "4", "1"], "Два H и один O дают три атома.", "Базовый"], ["Почему вода полярна?", "Полярные связи и изогнутая форма молекулы", ["Линейная симметричная форма", "Отсутствие электронов", "Наличие Na⁺"], "Электронная плотность смещена к кислороду, а заряды не компенсируются.", "Сложный"], ["Какой газ выделяется при реакции Na с водой?", "Водород", ["Кислород", "Азот", "Углекислый газ"], "2Na+2H₂O→2NaOH+H₂.", "Средний"], ["Растворитель в водном растворе соли", "Вода", ["Соль", "Осадок", "Ионы натрия"], "В водном растворе растворителем является вода.", "Базовый"], ["Где частичный отрицательный заряд в молекуле воды?", "Около атома кислорода", ["Около нейтрона", "На обоих H одинаково", "Вне молекулы"], "Кислород сильнее притягивает общие электронные пары.", "Сложный"], ["Коэффициент 2 в 2H₂O означает…", "Две молекулы воды", ["Два атома O в одной молекуле", "Два вида воды", "Другой состав молекулы"], "Коэффициент меняет количество молекул, не состав каждой.", "Средний"], ["Почему прозрачность не доказывает безопасность воды?", "Загрязнители могут быть невидимы", ["Прозрачная вода всегда токсична", "Вода не бывает прозрачной", "Цвет показывает все бактерии"], "Нужны химические и микробиологические проверки.", "Сложный"], ["Растворимость зависит…", "От вещества и условий", ["Все вещества растворимы", "Температура никогда не влияет", "Все газы растворяются одинаково"], "Растворимость зависит от свойств, температуры и иногда давления.", "Средний"], ["Сколько атомов H в 3H₂O?", "6", ["3", "2", "9"], "В каждой молекуле два H, значит 3×2=6.", "Базовый"], ["Что не является химической реакцией само по себе?", "Испарение воды", ["Реакция натрия с водой", "Окисление металла", "Образование нового вещества"], "При испарении меняется состояние, но молекулы H₂O сохраняются.", "Средний"]]}, {"id": "electrons", "sub": "Химия", "name": "Распределение электронов в атомах", "theory": "Ядро содержит положительно заряженные протоны и нейтральные нейтроны; электроны имеют отрицательный заряд. Порядковый номер Z равен числу протонов, а в нейтральном атоме также числу электронов. Массовое число — сумма протонов и нейтронов. В упрощённой школьной модели для первых 20 элементов часто используют распределение 2 на первом уровне, до 8 на втором и до 8 на третьем в базовых схемах. Na (Z=11): 2,8,1; O (Z=8): 2,6; S (Z=16): 2,8,6. При образовании иона число протонов не меняется, меняется число электронов: Na⁺ имеет 10 электронов, S²⁻ — 18. Положительный ион образуется при потере электронов, отрицательный — при приобретении. Внешние электроны особенно важны для химических свойств, поскольку участвуют в образовании связей.", "example": "Сера имеет Z=16: нейтральный атом содержит 16 протонов и 16 электронов, схема 2,8,6. Ион S²⁻ имеет 18 электронов, но всё ещё 16 протонов.", "q": [["Электронов в нейтральном атоме Z=13", "13", ["12", "14", "26"], "В нейтральном атоме число электронов равно Z.", "Базовый"], ["Распределение 12 электронов", "2,8,2", ["2,7,3", "8,4", "2,10"], "Два на первом уровне, восемь на втором, два на третьем.", "Средний"], ["Сколько электронов у Na⁺ при Z=11?", "10", ["11", "12", "9"], "Ион +1 потерял один электрон.", "Средний"], ["Сколько протонов у S²⁻ при Z=16?", "16", ["14", "18", "2"], "Число протонов не меняется при ионизации.", "Средний"], ["Сколько электронов у S²⁻?", "18", ["16", "14", "32"], "Сера приобрела два электрона: 16+2=18.", "Средний"], ["Массовое число при 11 протонах и 12 нейтронах", "23", ["11", "12", "1"], "Массовое число — сумма протонов и нейтронов.", "Средний"], [" ="grid3">${subjects.map(x=>`<article class="card subject" onclick="openSubject('${x.id}')"><div class="icon">${x.icon}</div><h3>${x.name}</h3><p class="muted">${x.ids.length} темы</p><span class="pill">Открыть →</span></article>`).join('')}</section><div class="head"><h2>Продолжить обучение</h2></div><section class="grid3">${topics.slice(0,3).map(x=>`<article class="card"><strong>${x.name}</strong><p class="small">${x.sub}</p><button class="btn primary" onclick="openTopic('${x.id}')">Изучить →</button></article>`).join('')}</section>`}function subjectHTML(){let x=S(st.subject);return `<div class="title"><button class="btn" onclick="home()">←</button><div><h1>${x.name}</h1><div class="muted">Теория и практика для 8 класса</div></div></div><section class="topicgrid">${x.ids.map(id=>{let z=T(id),a=hist.filter(h=>h.topic===id);return `<article class="card"><span class="pill">СОР / СОЧ</span><h3>${z.name}</h3><p class="muted">${z.sub}</p><p class="small">${a.length?'Попыток: '+a.length:'Ещё не пройдено'}</p><button class="btn primary" onclick="openTopic('${id}')">Теория и тест →</button></article>`}).join('')}</section>`}function svg(id){let col=T(id).sub==='Математика'?'math':T(id).sub==='Химия'?'chem':'bio';if(col==='math')return `<svg viewBox="0 0 600 140"><rect x="8" y="20" width="150" height="52" rx="12" fill="#dff4f2" stroke="#168b91"/><text x="83" y="51" text-anchor="middle" fill="#14586a">Условие</text><path d="M163 46H215m-8 -6 8 6-8 6" stroke="#176b87" stroke-width="3" fill="none"/><rect x="224" y="20" width="150" height="52" rx="12" fill="#e8e9ff" stroke="#7777d8"/><text x="299" y="51" text-anchor="middle" fill="#343a85">Правило</text><path d="M380 46H432m-8 -6 8 6-8 6" stroke="#176b87" stroke-width="3" fill="none"/><rect x="441" y="20" width="150" height="52" rx="12" fill="#fff0d9" stroke="#db9a38"/><text x="516" y="51" text-anchor="middle" fill="#81551a">Проверка</text><text x="300" y="108" text-anchor="middle" fill="currentColor">Обоснуй каждый шаг и провер ion topicHTML(){let x=T(st.topic);return `<div class="title"><button class="btn" onclick="openSubject('${x.sub==='Математика'?'math':x.sub==='Химия'?'chem':'bio'}')">←</button><div><h1>${x.name}</h1><div class="muted">${x.sub} · расширенный конспект</div></div></div><div class="theorylayout"><article class="card theory"><span class="pill">ТЕОРИЯ · 8 КЛАСС</span><div class="diagram">${svg(x.id)}<p class="small">Схема показывает основные связи. Используй её вместе с текстом.</p></div><h2>Развёрнутая теория</h2><p>${x.theory}</p><h2>Разобранный пример</h2><div class="example">${x.example}</div><div class="note"><strong>Стратегия для заданий НИШ:</strong> выдели условия, объясни выбор правила, покажи ход рассуждений, проверь ответ и сформулируй вывод по данным. Не делай выводов, которые не подтверждаются условием.</div><h2>Перед тестом</h2><p>Убедись, что можешь объяснить термины своими словами, назвать условия применения правил, решить пример и объяснить, почему другие ответы неверны.</p><button class="btn primary" onclick="start('${x.id}')">Начать тест · 10 вопросов →</button></article><aside class="card"><h3>План подготовки</h3><p>① Прочитай конспект и схему.</p><p>② Разбери пример без подсказки.</p><p>③ Пройди тест самостоятельно.</p><p>④ Разбери каждую ошибку и повтори раздел.</p></aside></div>`}function start(id){let x=T(id);if(!x||!x.q.length){msg('В этой теме пока нет вопросов.');return}st.topic=id;st.qs=x.q.map((q,i)=>({q,opts:[q[1],...q[2]].sort(()=>Math.random()-.5),orig:i}));st.idx=0;st.answers=Array(x.q.length).fill(null);st.checked=false;st.page='quiz';render()}function choose(i){if(st.checked)return;st.answers[st.idx]=i;render()}function check(){if(st.answers[st.idx]===null){msg('Выбери ответ перед проверкой.');return}st.checked=true;render()}function next(){if(!st.checked)return;if(st.idx<st.qs.length-1){st.idx++;st.checked=false;render()}else finish()}function finish(){let x=T(st.topic),correct=0,ans=st.qs.map((q,i)=>{let chosen=q.opts[st.answers[i]],raw=x.q[q.orig],ok=chosen===raw[1];if(ok)correct++;return{question:raw[0],chosen:chosen||'Нет ответа',correct:raw[1],explanation:raw[3],level:raw[4],ok}});let a={topic:x.id,name:x.name,date:new Date().toLocaleString('ru-RU'),correct,total:ans.length,percent:Math.round(correct/ans.length*100),answers:ans};hist.push(a);try{localStorage.setItem('sp_nis_history',JSON.stringify(hist))}catch(e){}st.last=a;st.page='result';render()}function quizHTML(){let x=T(st.topic),q=st.qs[st.idx],sel=st.answers[st.idx];return `<div class="qbox"><div class="title"><button class="btn" onclick="if(confirm('Выйти из теста?'))openTopic('${x.id}')">←</button><div><h1>${x.name}</h1><div class="muted">Вопрос ${st.idx+1} из ${st.qs.length}</div></div></div><section class="card"><div class="qmeta"><span>Вопрос ${st.idx+1}/${st.qs.length}</span><span>${q.q[4]} уровень</span></div><div class="track"><div class="fill" style="width:${(st.idx+1)/st.qs.length*100}%"></div></div><h2>${q.q[0]}</h2><div class="answers">${q.opts.map((o,i)=>`<button class="answer ${sel===i?'selected':''} ${st.checked&&o===x.q[q.orig][1]?'good':st.checked&&sel===i?'bad':''}" ${st.checked?'disabled':''} onclick="choose(${i})">${'ABCD'[i]}. ${o}</button>`).join('')}</div>${st.checked?`<div class="explain"><strong>${q.opts[sel]===x.q[q.orig][1]?'Верно!':'Разбор ответа'}</strong><br>${x.q[q.orig][3]}</div>`:''}<div class="qbottom" style="margin-top:20px"><span class="small">${st.answers.filter(v=>v!==null).length} ответов выбрано</span>${st.checked?`<button class="btn primary" onclick="next()">${st.idx===st.qs.length-1?'Завершить тест':'Следующий вопрос →'}</button>`:`<button class="btn primary" onclick="check()">Проверить ответ</button>`}</div></section></div>`}function resultHTML(){let a=st.last;return `<section class="card"><span class="pill">ТЕСТ ЗАВЕРШЁН</span><div class="score">${a.percent}%</div><h1 style="text-align:center">${a.correct} из ${a.total} правильных</h1><p class="muted" style="text-align:center">${a.name} · ${a.date}</p><button class="btn primary" onclick="openTopic('${a.topic}')">Повторить теорию</button> <button class="btn" onclick="start('${a.topic}')">Пройти снова</button> <button class="btn" onclick="progress()">Мой прогресс</button><h2>Разбор ответов</h2>${a.answers.map((q,i)=>`<div class="reviewitem"><strong>${i+1}. ${q.ok?'✓':'✕'} ${q.question}</strong><p>Твой ответ: ${q.chosen}</p><p>Правильный ответ: <strong>${q.correct}</strong></p><p class="muted">${q.explanation}</p></div>`).join('')}</section>`}function progress(){st.page='progress';render()}function progressHTML(){let avg=hist.length?Math.round(hist.reduce((a,x)=>a+x.percent,0)/hist.length):0;return `<div class="title"><button class="btn" onclick="home()">←</button><h1>Мой прогресс</h1></div><section class="grid3"><div class="card"><span class="small">Пройдено тестов</span><div class="score">${hist.length}</div></div><div class="card"><span class="small">Средний результат</span><div class="score">${avg}%</div></div><div class="card"><span class="small">Темы с попытками</span><div class="score">${topics.filter(t=>hist.some(h=>h.topic===t.id)).length}/10</div></div></section><div class="head"><h2>История попыток</h2><button class="btn" onclick="if(confirm('Очистить историю?')){hist=[];localStorage.removeItem('sp_nis_history');render()}">Очистить</button></div><section class="card">${[...hist].reverse().map(a=>`<div class="historyitem"><strong>${a.name} — ${a.percent}%</strong><div class="small">${a.date} · ${a.correct}/${a.total}</div><button class="btn" onclick="openTopic('${a.topic}')">Повторить тему</button></div>`).join('')||'История пока пуста.'}</section>`}function about(){st.page='about';render()}function aboutHTML(){return `<div class="title"><button class="btn" onclick="home()">←</button><h1>О проекте StudyPoint</h1></div><section class="card"><h2>Цель</h2><p>Платформа помогает самостоятельно готовиться к СОР и СОЧ: изучать теорию, решать задания, разбирать ошибки и отслеживать прогресс.</p><p>Тесты проверяются в браузере. История сохраняется в LocalStorage на этом устройстве; регистрация и синхронизация между устройствами не подключены.</p><div class="note">Результаты — учебная обратная связь, а не официальная оценка.</div></section>`}render();
</script></body></html>
